<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0f1f">
<meta name="color-scheme" content="dark">
<title>Ăn gì hôm nay?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --night: #0c0f1f;      /* page */
    --dusk: #151a31;       /* raised surfaces */
    --haze: #222844;       /* borders, chips */
    --paper: #f4efe4;      /* text */
    --mist: #9ba1c0;       /* secondary text */
    --lantern: #ffb547;    /* accent */
    --ember: #ff7a3d;      /* accent gradient end */
    --jade: #43e0a0;       /* open */
    --rust: #ff6b6b;       /* closed */
    --display: 'Bricolage Grotesque', 'Be Vietnam Pro', system-ui, sans-serif;
    --body: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
    --bar-h: 120px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; background: var(--night); }
  body {
    font-family: var(--body); color: var(--paper); background: var(--night);
    font-size: 15px; line-height: 1.45; min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--lantern); outline-offset: 3px; border-radius: 8px; }
  svg.i { width: 15px; height: 15px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; padding: 34px 20px 18px;
    padding-top: max(34px, calc(env(safe-area-inset-top) + 22px));
    isolation: isolate; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; z-index: -1;
    width: 520px; height: 520px; right: -180px; top: -260px;
    background: radial-gradient(circle, rgba(255,150,60,.30), rgba(255,120,60,.08) 45%, transparent 70%);
    filter: blur(10px);
  }
  .hero h1 {
    font-family: var(--display); font-weight: 800;
    font-size: clamp(2.5rem, 11vw, 4.4rem); line-height: .95; letter-spacing: -0.035em;
    background: linear-gradient(100deg, var(--paper) 30%, #ffd59a 70%, var(--lantern));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    max-width: 12ch; text-wrap: balance; padding: .14em 0 .06em; margin-top: -.14em;
    animation: rise .7s cubic-bezier(.2,.7,.2,1) both;
  }
  .hero p { margin-top: 12px; color: var(--mist); font-size: .95rem; animation: rise .7s .08s cubic-bezier(.2,.7,.2,1) both; }
  .open-link {
    color: var(--paper); font-weight: 600; display: inline-flex; align-items: center; gap: 7px;
    border-bottom: 1px dashed rgba(244,239,228,.35); padding-bottom: 1px;
  }
  .open-link.on { color: var(--jade); border-color: var(--jade); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .glow-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--jade); flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(67,224,160,.18), 0 0 10px rgba(67,224,160,.8);
  }
  .glow-dot.off { background: var(--rust); box-shadow: 0 0 0 3px rgba(255,107,107,.15); }

  /* ---------- Sticky toolbar ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 1000;
    padding: 10px 20px 12px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(12,15,31,.82);
    backdrop-filter: saturate(160%) blur(16px); -webkit-backdrop-filter: saturate(160%) blur(16px);
    border-bottom: 1px solid transparent; transition: border-color .2s;
  }
  .toolbar.stuck { border-bottom-color: var(--haze); }
  .search {
    display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px;
    background: var(--dusk); border: 1px solid var(--haze); border-radius: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .search:focus-within { border-color: rgba(255,181,71,.6); box-shadow: 0 0 0 4px rgba(255,181,71,.12); }
  .search svg.i { width: 18px; height: 18px; color: var(--mist); }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 16px; color: var(--paper);
  }
  .search input::placeholder { color: #6c7291; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear { color: var(--mist); font-size: 20px; line-height: 1; display: none; padding: 4px; }
  .search.has-text .clear { display: block; }

  .chips {
    display: flex; gap: 8px; margin: 12px -20px 0; padding: 0 20px 2px;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; height: 36px; padding: 0 15px; border-radius: 999px;
    background: var(--dusk); border: 1px solid var(--haze); color: #d9d6e6;
    font-size: .86rem; font-weight: 500; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 7px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip:hover { border-color: #3a4166; }
  .chip.on {
    background: linear-gradient(135deg, var(--lantern), var(--ember)); border-color: transparent;
    color: #1d1206; font-weight: 600; box-shadow: 0 4px 16px rgba(255,140,60,.3);
  }
  .chip-gap { flex-shrink: 0; width: 10px; }

  /* ---------- Layout ---------- */
  .list-pane { padding-bottom: 110px; min-width: 0; }
  .result-bar {
    display: flex; justify-content: space-between; align-items: center;
    color: var(--mist); font-size: .85rem; padding: 16px 20px 12px;
  }
  .reset { color: var(--lantern); font-weight: 600; font-size: .85rem; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 18px; padding: 0 16px; }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); padding: 0 20px; } }

  .map-pane { display: none; }
  #map { width: 100%; height: 100%; background: #0e1326; }
  body.view-map .hero, body.view-map .result-bar, body.view-map .grid { display: none; }
  body.view-map .map-pane {
    display: block; position: fixed; left: 0; right: 0; bottom: 0; top: var(--bar-h); z-index: 1;
  }

  @media (min-width: 960px) {
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 42%; }
    .hero { padding: 48px 32px 22px; }
    .toolbar { padding-left: 32px; padding-right: 32px; display: flex; gap: 14px; align-items: center; }
    .search { width: 320px; flex-shrink: 0; }
    .chips { flex: 1; margin: 0; padding: 0; min-width: 0; }
    .result-bar { padding: 18px 32px 14px; }
    .grid { padding: 0 32px; gap: 22px; }
    .map-pane, body.view-map .map-pane {
      display: block; position: sticky; top: 0; height: 100vh;
      border-left: 1px solid var(--haze);
    }
    body.view-map .hero, body.view-map .result-bar { display: block; }
    body.view-map .result-bar { display: flex; }
    body.view-map .grid { display: grid; }
    .view-toggle { display: none !important; }
  }
  @media (min-width: 1500px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  /* ---------- Card ---------- */
  .card {
    position: relative; border-radius: 22px; overflow: hidden; cursor: pointer;
    background: var(--dusk); isolation: isolate;
    box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 18px 40px -18px rgba(0,0,0,.7);
    transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s;
  }
  @media (hover: hover) {
    .card:hover { transform: translateY(-3px); box-shadow: 0 0 0 1px rgba(255,181,71,.35), 0 26px 50px -20px rgba(0,0,0,.85); }
  }
  .card.hl { box-shadow: 0 0 0 2px var(--lantern), 0 18px 40px -18px rgba(255,150,60,.5); }

  .photo { position: relative; aspect-ratio: 4 / 5; background: var(--dusk); overflow: hidden; }
  @media (max-width: 599px) { .photo { aspect-ratio: 5 / 4; } }
  .shots {
    display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .shots::-webkit-scrollbar { display: none; }
  .shots img {
    flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover;
    scroll-snap-align: start; display: block;
  }
  .no-photo {
    height: 100%; display: grid; place-items: center; font-size: 3rem;
    background: radial-gradient(circle at 70% 20%, rgba(255,150,60,.25), transparent 60%), linear-gradient(160deg, #1d2342, #10142a);
  }
  .shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(8,10,22,.96) 0%, rgba(8,10,22,.75) 30%, rgba(8,10,22,0) 62%),
                linear-gradient(to bottom, rgba(8,10,22,.45), transparent 22%);
  }
  .over { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 18px 18px; pointer-events: none; }
  .status-line { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: #dcd9e8; }
  .status-line b { font-weight: 600; }
  .status-line b.open { color: var(--jade); }
  .status-line b.closed { color: var(--rust); }
  .card h3 {
    font-family: var(--display); font-weight: 700; font-size: 1.45rem; line-height: 1.1;
    letter-spacing: -0.02em; margin-top: 6px; text-wrap: balance;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .cuisine { color: #c9c6d8; font-size: .88rem; margin-top: 4px; }
  .facts-row { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; color: var(--mist); font-size: .8rem; }
  .facts-row span { display: inline-flex; align-items: center; gap: 5px; }

  .rate {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 10px; border-radius: 999px; font-weight: 700; font-size: .85rem;
    background: rgba(12,15,31,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.12);
  }
  .rate .star { color: var(--lantern); }
  .rate small { color: var(--mist); font-weight: 500; font-size: .75rem; }
  .dots { position: absolute; top: 18px; left: 16px; display: flex; gap: 4px; pointer-events: none; z-index: 2; }
  .dots i { width: 16px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.35); transition: background .2s; }
  .dots i.on { background: #fff; }
  .nav {
    position: absolute; top: 42%; transform: translateY(-50%); z-index: 2;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(12,15,31,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.15); font-size: 20px; line-height: 1;
    display: grid; place-items: center; opacity: 0; transition: opacity .15s;
  }
  .nav.prev { left: 10px; } .nav.next { right: 10px; }
  @media (hover: hover) { .photo:hover .nav { opacity: 1; } }

  .empty { text-align: center; padding: 70px 20px; color: var(--mist); grid-column: 1 / -1; }
  .empty strong { display: block; font-family: var(--display); font-size: 1.4rem; color: var(--paper); margin-bottom: 6px; }

  /* ---------- Floating view toggle (mobile) ---------- */
  .view-toggle {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(22px, calc(env(safe-area-inset-bottom) + 10px)); z-index: 1100;
    background: linear-gradient(135deg, var(--lantern), var(--ember)); color: #1d1206;
    border-radius: 999px; padding: 13px 22px; font-weight: 600; font-size: .92rem;
    box-shadow: 0 10px 30px rgba(255,120,50,.35), 0 2px 6px rgba(0,0,0,.4);
    display: flex; align-items: center; gap: 8px;
  }
  .view-toggle svg.i { width: 18px; height: 18px; stroke-width: 2.2; }
  body.peek-open .view-toggle { bottom: calc(max(22px, calc(env(safe-area-inset-bottom) + 10px)) + 124px); }

  /* ---------- Map ---------- */
  .leaflet-container { font-family: var(--body); }
  .leaflet-div-icon { background: none; border: 0; }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(200deg) brightness(.85) contrast(.92) saturate(.45); }
  .pin {
    display: inline-flex; align-items: center; gap: 4px; transform: translate(-50%, -50%);
    background: var(--dusk); color: var(--paper); border: 1px solid #3a4166;
    border-radius: 999px; padding: 5px 10px; font-weight: 700; font-size: 12px; white-space: nowrap;
    box-shadow: 0 6px 16px rgba(0,0,0,.5); transition: transform .12s, background .12s;
  }
  .pin .s { color: var(--lantern); }
  .pin.sel { background: linear-gradient(135deg, var(--lantern), var(--ember)); color: #1d1206; border-color: transparent; transform: translate(-50%, -50%) scale(1.15); }
  .pin.sel .s { color: #1d1206; }
  .me-dot {
    width: 16px; height: 16px; border-radius: 50%; background: #4c8dff; transform: translate(-50%, -50%);
    border: 3px solid #fff; box-shadow: 0 0 0 8px rgba(76,141,255,.25);
  }
  .leaflet-control-zoom a { background: var(--dusk) !important; color: var(--paper) !important; border-color: var(--haze) !important; }
  .leaflet-control-zoom { border: 1px solid var(--haze) !important; border-radius: 12px !important; overflow: hidden; }
  .leaflet-control-attribution { background: rgba(12,15,31,.7) !important; color: var(--mist) !important; }
  .leaflet-control-attribution a { color: var(--mist) !important; }
  .peek {
    position: absolute; left: 12px; right: 12px; bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 1000; display: none; cursor: pointer; overflow: hidden;
    background: rgba(21,26,49,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--haze); border-radius: 20px; box-shadow: 0 18px 40px rgba(0,0,0,.6);
  }
  .peek.show { display: flex; animation: rise .25s ease both; }
  .peek img, .peek .ph { width: 108px; height: 108px; object-fit: cover; flex-shrink: 0; background: var(--haze); }
  .peek .ph { display: grid; place-items: center; font-size: 2rem; }
  .peek .pb { padding: 12px 36px 12px 14px; min-width: 0; }
  .peek h4 { font-family: var(--display); font-size: 1.1rem; line-height: 1.15; letter-spacing: -0.01em; }
  .peek .cuisine { font-size: .82rem; }
  .peek .status-line { margin-top: 6px; }
  .peek .x { position: absolute; top: 8px; right: 10px; color: var(--mist); font-size: 22px; line-height: 1; }
  @media (min-width: 960px) { .peek { left: auto; right: 16px; width: 380px; } }

  /* ---------- Detail sheet ---------- */
  .scrim { position: fixed; inset: 0; z-index: 2000; background: rgba(4,6,14,.65); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2001;
    background: var(--dusk); border-radius: 26px 26px 0 0; border-top: 1px solid var(--haze);
    max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
    transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.show { transform: none; }
  @media (min-width: 720px) {
    .sheet {
      left: 50%; right: auto; bottom: auto; top: 50%; width: 580px; border-radius: 26px; border: 1px solid var(--haze);
      transform: translate(-50%, -46%); opacity: 0; pointer-events: none; max-height: 90vh;
      transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .2s;
    }
    .sheet.show { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
  }
  .sheet .photo { aspect-ratio: 16 / 11; }
  .sheet .shade { background: linear-gradient(to top, var(--dusk) 0%, rgba(21,26,49,.6) 25%, transparent 55%), linear-gradient(to bottom, rgba(8,10,22,.5), transparent 25%); }
  .sheet .dots { top: 20px; left: 50%; transform: translateX(-50%); }
  .sheet-close {
    position: absolute; top: 12px; right: 12px; z-index: 3; width: 38px; height: 38px; border-radius: 50%;
    background: rgba(12,15,31,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.15); font-size: 22px; display: grid; place-items: center;
  }
  .sb { padding: 0 22px 26px; margin-top: -54px; position: relative; z-index: 2; }
  .sb h2 { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1.04; letter-spacing: -0.03em; text-wrap: balance; }
  .sb .cuisine { font-size: .95rem; margin-top: 6px; }
  .sb .summary { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 12px; font-size: .88rem; color: #dcd9e8; }
  .sb .summary .star { color: var(--lantern); }
  .actions { display: grid; gap: 10px; margin: 20px 0 6px; }
  .act {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 12px 6px; border-radius: 16px; background: var(--haze); border: 1px solid #2d3456;
    font-size: .8rem; font-weight: 600; text-align: center; transition: background .15s;
  }
  .act:hover { background: #2a3152; }
  .act svg.i { width: 20px; height: 20px; }
  .act.primary { background: linear-gradient(135deg, var(--lantern), var(--ember)); color: #1d1206; border-color: transparent; }
  .note {
    margin-top: 18px; padding: 14px 16px; border-radius: 16px; font-size: .95rem; line-height: 1.55;
    background: linear-gradient(135deg, rgba(255,181,71,.12), rgba(255,122,61,.05));
    border: 1px solid rgba(255,181,71,.2); color: #f1e6d2;
  }
  .facts { margin-top: 10px; }
  .fact { display: flex; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--haze); font-size: .92rem; }
  .fact:last-child { border-bottom: 0; }
  .fact svg.i { width: 18px; height: 18px; color: var(--lantern); margin-top: 1px; }
  .fact .sub { color: var(--mist); font-size: .82rem; margin-top: 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .tags span { background: var(--night); border: 1px solid var(--haze); border-radius: 999px; padding: 5px 11px; font-size: .78rem; color: var(--mist); }
  body.sheet-open { overflow: hidden; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="layout">
  <main class="list-pane">
    <section class="hero">
      <h1 id="headline">Hôm nay ăn gì?</h1>
      <p id="hero-sub">Đang tải danh sách quán…</p>
    </section>

    <div class="toolbar" id="toolbar">
      <label class="search" id="search-box">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Tìm quán, món, khu vực…" autocomplete="off" enterkeyhint="search">
        <button class="clear" id="q-clear" type="button" aria-label="Xoá tìm kiếm">×</button>
      </label>
      <div class="chips" id="chips"></div>
    </div>

    <div class="result-bar"><span id="result-text"></span><button class="reset" id="reset" hidden>Bỏ lọc</button></div>
    <div class="grid" id="grid"></div>
  </main>

  <aside class="map-pane" id="map-pane">
    <div id="map"></div>
    <div class="peek" id="peek"></div>
  </aside>
</div>

<button class="view-toggle" id="view-toggle"></button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ================= State ================= */
const state = { places: [], q: '', cat: 'all', openNow: false, topRated: false, near: false, me: null, selected: null };

const CATEGORIES = [
  { id: 'viet',  label: '🍲 Món Việt',           re: /bún|phở|chả cá|cơm tấm|bánh|việt nam|nhà hàng việt/i },
  { id: 'asia',  label: '🥢 Nhật, Trung, Hàn',   re: /nhật|japan|trung quốc|tứ xuyên|hàn|korea|cà ri|sushi|ramen|udon/i },
  { id: 'grill', label: '🔥 Lẩu & Nướng',        re: /lẩu|nướng|grill|bbq|xiên/i },
  { id: 'nhau',  label: '🍺 Nhậu',               re: /bia hơi|nhậu/i },
  { id: 'drink', label: '🍸 Cafe & Bar',         re: /cafe|cà phê|coffee|bar|wine|cocktail|craft.?beer/i },
];

const I = {
  pin:   '<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  cash:  '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  walk:  '<svg class="i" viewBox="0 0 24 24"><circle cx="13" cy="4.5" r="1.8"/><path d="m9 21 3-7 3 3v4M7 12l3-4 4 1 3 3"/></svg>',
  clock: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  phone: '<svg class="i" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  nav:   '<svg class="i" viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2-8z"/></svg>',
  car:   '<svg class="i" viewBox="0 0 24 24"><path d="M5 17h14v-5l-2-5H7l-2 5z"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>',
  map:   '<svg class="i" viewBox="0 0 24 24"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
  list:  '<svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
};

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();

function haversine(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}
const fmtDist = km => km < 1 ? `${Math.round(km*100)*10} m` : `${km.toFixed(1)} km`;
const imagesOf = p => p.images?.length ? p.images : (p.photo ? [p.photo] : p.image ? [p.image] : []);

function district(addr) {
  if (!addr) return '';
  const parts = addr.split(',').map(s => s.trim()).filter(Boolean);
  return parts.length >= 3 ? parts[parts.length - 2] : (parts[0] || '');
}
function priceShort(price) {
  if (!price) return '';
  if (typeof price === 'number') return ['', 'Bình dân', 'Giá vừa', 'Cao cấp', 'Sang trọng'][price] || '';
  const nums = String(price).match(/\d[\d.,]*/g);
  if (!nums) return String(price);
  const k = n => { const v = parseInt(n.replace(/[.,]/g, ''), 10); return v >= 1000 ? Math.round(v/1000) + 'k' : String(v); };
  return nums.slice(0, 2).map(k).join('–');
}
const reviews = n => !n ? '' : n >= 1000 ? (n/1000).toFixed(1).replace('.0','') + 'k' : String(n);

/* Hours: "06:00 – 20:00", "11:00 – 14:00, 17:30 – 23:00", "Cafe 9:00 – 18:00, Wine 16:00 – 24:00", "17:00 – 1:00" */
function parseHours(h) {
  if (!h) return null;
  const out = [], re = /(\d{1,2})[:h](\d{2})\s*[–—-]\s*(\d{1,2})[:h](\d{2})/g;
  let m;
  while ((m = re.exec(h))) {
    const s = +m[1]*60 + +m[2]; let e = +m[3]*60 + +m[4];
    if (e <= s) e += 1440;
    out.push([s, e]);
  }
  return out.length ? out.sort((a,b) => a[0]-b[0]) : null;
}
const hhmm = mins => { mins %= 1440; return `${String(Math.floor(mins/60)).padStart(2,'0')}:${String(mins%60).padStart(2,'0')}`; };

function openStatus(p, now = new Date()) {
  const ranges = parseHours(p.hours);
  if (!ranges) return null;
  const t = now.getHours()*60 + now.getMinutes();
  for (const [s, e] of ranges) {
    for (const tt of [t, t + 1440]) {
      if (tt >= s && tt < e) return { open: true, word: e - tt <= 45 ? 'Sắp đóng' : 'Đang mở', text: `đến ${hhmm(e)}` };
    }
  }
  const next = ranges.find(([s]) => s > t);
  return { open: false, word: 'Đã đóng', text: next ? `mở lúc ${hhmm(next[0])}` : `mở lại ${hhmm(ranges[0][0])} mai` };
}
const catsOf = p => { const hay = [p.cuisine, p.name, ...(p.tags || [])].join(' '); return CATEGORIES.filter(c => c.re.test(hay)).map(c => c.id); };

/* ================= Filtering ================= */
function filtered() {
  const q = norm(state.q.trim());
  const list = state.places.filter(p => {
    if (state.cat !== 'all' && !p._cats.includes(state.cat)) return false;
    if (state.openNow && !openStatus(p)?.open) return false;
    if (state.topRated && !(p.rating >= 4.5)) return false;
    if (q && !p._search.includes(q)) return false;
    return true;
  });
  if (state.me) list.forEach(p => p._dist = (p.lat && p.lng) ? haversine(state.me, p) : null);
  if (state.near && state.me) list.sort((a, b) => (a._dist ?? 1e9) - (b._dist ?? 1e9));
  else list.sort((a, b) => ((openStatus(b)?.open ? 1 : 0) - (openStatus(a)?.open ? 1 : 0)) || ((b.rating || 0) - (a.rating || 0)));
  return list;
}

/* ================= Hero ================= */
function headlineFor(d = new Date()) {
  const h = d.getHours();
  if (h >= 5 && h < 10) return 'Sáng nay ăn gì?';
  if (h >= 10 && h < 14) return 'Trưa nay ăn gì?';
  if (h >= 14 && h < 17) return 'Chiều nay ăn gì?';
  if (h >= 17 && h < 22) return 'Tối nay ăn gì?';
  return 'Khuya rồi, còn quán nào?';
}
function renderHero() {
  $('#headline').textContent = headlineFor();
  const total = state.places.length;
  const open = state.places.filter(p => openStatus(p)?.open).length;
  $('#hero-sub').innerHTML = open
    ? `<button class="open-link ${state.openNow ? 'on' : ''}" id="open-link"><i class="glow-dot"></i>${open} quán đang mở</button> trong ${total} quán bạn đã lưu`
    : `${total} quán bạn đã lưu, giờ này đều đã đóng`;
}

/* ================= Chips ================= */
function renderChips() {
  const cats = CATEGORIES.filter(c => state.places.some(p => p._cats.includes(c.id)));
  $('#chips').innerHTML = `
    <button class="chip ${state.near ? 'on' : ''}" data-act="near">📍 Gần tôi</button>
    <button class="chip ${state.openNow ? 'on' : ''}" data-act="open">🕒 Đang mở</button>
    <button class="chip ${state.topRated ? 'on' : ''}" data-act="top">⭐ 4.5+</button>
    <span class="chip-gap"></span>
    <button class="chip ${state.cat === 'all' ? 'on' : ''}" data-cat="all">Tất cả</button>
    ${cats.map(c => `<button class="chip ${state.cat === c.id ? 'on' : ''}" data-cat="${c.id}">${c.label}</button>`).join('')}`;
}

/* ================= Pieces ================= */
function shotsHtml(p) {
  const imgs = imagesOf(p);
  if (!imgs.length) return `<div class="no-photo">${esc(p.emoji || '🍽️')}</div>`;
  const shots = imgs.map((s, i) => `<img src="${esc(s)}" alt="${esc(p.name)}" ${i ? 'loading="lazy"' : ''} onerror="this.remove()">`).join('');
  if (imgs.length === 1) return `<div class="shots">${shots}</div>`;
  return `<div class="shots">${shots}</div>
    <div class="dots">${imgs.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>
    <button class="nav prev" data-nav="-1" aria-label="Ảnh trước">‹</button>
    <button class="nav next" data-nav="1" aria-label="Ảnh sau">›</button>`;
}
function statusLine(p) {
  const st = openStatus(p);
  if (!st) return '';
  return `<div class="status-line"><i class="glow-dot ${st.open ? '' : 'off'}"></i><b class="${st.open ? 'open' : 'closed'}">${st.word}</b><span>${esc(st.text)}</span></div>`;
}
function factsRow(p) {
  const out = [];
  const d = district(p.address); if (d) out.push(`<span>${I.pin}${esc(d)}</span>`);
  const pr = priceShort(p.price); if (pr) out.push(`<span>${I.cash}${esc(pr)}</span>`);
  if (state.me && p._dist != null) out.push(`<span>${I.walk}${fmtDist(p._dist)}</span>`);
  return out.length ? `<div class="facts-row">${out.join('')}</div>` : '';
}
function rateBadge(p) {
  if (!p.rating) return '';
  const n = reviews(p.review_count);
  return `<span class="rate"><span class="star">★</span>${p.rating.toFixed(1)}${n ? ` <small>${n}</small>` : ''}</span>`;
}

/* ================= List ================= */
function renderList(list) {
  const total = state.places.length;
  const active = state.cat !== 'all' || state.openNow || state.topRated || state.q.trim();
  $('#result-text').textContent = active
    ? `${list.length} trên ${total} quán khớp bộ lọc`
    : (state.near && state.me ? 'Sắp xếp từ gần đến xa' : 'Quán đang mở và điểm cao lên trước');
  $('#reset').hidden = !active;

  if (!list.length) {
    $('#grid').innerHTML = `<div class="empty"><strong>Không có quán nào khớp</strong>Bỏ bớt bộ lọc hoặc thử từ khoá khác.</div>`;
    return;
  }
  $('#grid').innerHTML = list.map(p => `
    <article class="card ${state.selected === p.id ? 'hl' : ''}" data-id="${esc(p.id)}" tabindex="0" aria-label="${esc(p.name)}">
      <div class="photo">
        ${shotsHtml(p)}
        <div class="shade"></div>
        ${rateBadge(p)}
        <div class="over">
          ${statusLine(p)}
          <h3>${esc(p.name)}</h3>
          ${p.cuisine ? `<div class="cuisine">${esc(p.cuisine)}</div>` : ''}
          ${factsRow(p)}
        </div>
      </div>
    </article>`).join('');
}

/* ================= Map ================= */
let map, markers = {}, meMarker;
const isDesktop = () => matchMedia('(min-width: 960px)').matches;

function ensureMap() {
  if (map || typeof L === 'undefined') return;
  map = L.map('map', { zoomControl: false }).setView([21.03, 105.83], 13);
  L.control.zoom({ position: 'topright' }).addTo(map);
  // OpenStreetMap tiles: free, no API key. Darkened with a CSS filter (.leaflet-tile-pane).
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  map.on('click', () => selectPlace(null));
}
function renderMap(list) {
  if (!map) return;
  Object.values(markers).forEach(m => m.remove());
  markers = {};
  const pts = [];
  list.forEach(p => {
    if (!p.lat || !p.lng) return;
    const label = p.rating ? `<span class="s">★</span>${p.rating.toFixed(1)}` : '🍽️';
    const icon = L.divIcon({ className: '', html: `<span class="pin ${state.selected === p.id ? 'sel' : ''}">${label}</span>`, iconSize: [0, 0] });
    const m = L.marker([p.lat, p.lng], { icon, title: p.name }).addTo(map);
    m.on('click', e => { L.DomEvent.stopPropagation(e); selectPlace(p.id, { fromMap: true }); });
    markers[p.id] = m; pts.push([p.lat, p.lng]);
  });
  if (state.me) {
    if (!meMarker) meMarker = L.marker([state.me.lat, state.me.lng], { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [0,0] }), interactive: false }).addTo(map);
    pts.push([state.me.lat, state.me.lng]);
  }
  if (pts.length) map.fitBounds(pts, { padding: [60, 60], maxZoom: 15 });
}
function highlightPins(ids) {
  Object.entries(markers).forEach(([pid, m]) => {
    m.getElement()?.querySelector('.pin')?.classList.toggle('sel', ids.includes(pid));
    m.setZIndexOffset(ids.includes(pid) ? 1000 : 0);
  });
}
function selectPlace(id, { fromMap = false } = {}) {
  state.selected = id;
  highlightPins(id ? [id] : []);
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('hl', c.dataset.id === id));
  const peek = $('#peek');
  if (!id) { peek.classList.remove('show'); document.body.classList.remove('peek-open'); return; }
  if (!fromMap) return;
  const p = state.places.find(x => x.id === id);
  const img = imagesOf(p)[0];
  peek.innerHTML = `${img ? `<img src="${esc(img)}" alt="" onerror="this.outerHTML='<div class=ph>🍽️</div>'">` : `<div class="ph">🍽️</div>`}
    <div class="pb">
      <h4>${esc(p.name)}</h4>
      <div class="cuisine">${p.rating ? `<span style="color:var(--lantern)">★</span> ${p.rating.toFixed(1)}&nbsp;&nbsp;` : ''}${esc(p.cuisine || '')}</div>
      ${statusLine(p)}
    </div>
    <button class="x" aria-label="Đóng">×</button>`;
  peek.classList.remove('show'); void peek.offsetWidth; peek.classList.add('show');
  document.body.classList.add('peek-open');
  if (isDesktop()) document.querySelector(`.card[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ================= Detail sheet ================= */
function openSheet(id) {
  const p = state.places.find(x => x.id === id);
  if (!p) return;
  const st = openStatus(p);
  const dirUrl = (p.lat && p.lng) ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}` : (p.maps_url || '');
  const acts = [
    dirUrl && `<a class="act primary" href="${esc(dirUrl)}" target="_blank" rel="noopener">${I.nav}Chỉ đường</a>`,
    p.phone && `<a class="act" href="tel:${esc(p.phone.replace(/\s/g, ''))}">${I.phone}Gọi quán</a>`,
    p.address && `<button class="act" data-grab="${esc(p.address)}">${I.car}Đặt Grab</button>`,
    p.maps_url && `<a class="act" href="${esc(p.maps_url)}" target="_blank" rel="noopener">${I.map}Google Maps</a>`,
  ].filter(Boolean);
  const priceFull = typeof p.price === 'number' ? priceShort(p.price) : p.price;
  $('#sheet').innerHTML = `
    <div class="photo">
      ${shotsHtml(p)}
      <div class="shade"></div>
      <button class="sheet-close" data-close aria-label="Đóng">×</button>
    </div>
    <div class="sb">
      <h2>${esc(p.name)}</h2>
      ${p.cuisine ? `<div class="cuisine">${esc(p.cuisine)}</div>` : ''}
      <div class="summary">
        ${p.rating ? `<span><span class="star">★</span> <b>${p.rating.toFixed(1)}</b>${p.review_count ? ` <span style="color:var(--mist)">(${reviews(p.review_count)} đánh giá)</span>` : ''}</span>` : ''}
        ${statusLine(p)}
      </div>
      <div class="actions" style="grid-template-columns: repeat(${acts.length || 1}, 1fr)">${acts.join('')}</div>
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
      <div class="facts">
        ${p.address ? `<div class="fact">${I.pin}<div><div>${esc(p.address)}</div>${state.me && p._dist != null ? `<div class="sub">Cách bạn ${fmtDist(p._dist)}</div>` : ''}</div></div>` : ''}
        ${p.hours ? `<div class="fact">${I.clock}<div><div>${esc(p.hours)}</div>${st ? `<div class="sub">${st.word}, ${esc(st.text)}</div>` : ''}</div></div>` : ''}
        ${priceFull ? `<div class="fact">${I.cash}<div>${esc(priceFull)}</div></div>` : ''}
        ${p.phone ? `<div class="fact">${I.phone}<div>${esc(p.phone)}</div></div>` : ''}
      </div>
      ${p.tags?.length ? `<div class="tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
    </div>`;
  $('#sheet').scrollTop = 0;
  $('#sheet').classList.add('show');
  $('#scrim').classList.add('show');
  document.body.classList.add('sheet-open');
  history.pushState({ sheet: id }, '', '#' + encodeURIComponent(id));
}
function closeSheet(fromPop = false) {
  if (!$('#sheet').classList.contains('show')) return;
  $('#sheet').classList.remove('show');
  $('#scrim').classList.remove('show');
  document.body.classList.remove('sheet-open');
  if (!fromPop && history.state?.sheet) history.back();
}
function grabGo(address) {
  navigator.clipboard?.writeText(address).catch(() => {});
  window.location.href = `grab://open?screenType=BOOKING&type=CAR&dropOffAddress=${encodeURIComponent(address)}`;
}

/* ================= View toggle (mobile) ================= */
function setView(v) {
  document.body.classList.toggle('view-map', v === 'map');
  $('#view-toggle').innerHTML = v === 'map' ? `${I.list}Danh sách` : `${I.map}Xem bản đồ`;
  window.scrollTo(0, 0);
  if (v === 'map') { ensureMap(); render(); requestAnimationFrame(() => map?.invalidateSize()); }
  else selectPlace(null);
}

/* ================= Render ================= */
function render() {
  const list = filtered();
  renderHero(); renderChips(); renderList(list);
  if (map) renderMap(list);
  if (state.selected && !list.some(p => p.id === state.selected)) selectPlace(null);
}

/* ================= Events ================= */
function locate() {
  if (!navigator.geolocation) { alert('Trình duyệt không hỗ trợ định vị'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    state.me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    state.near = true;
    if (meMarker) { meMarker.remove(); meMarker = null; }
    render();
  }, () => alert('Không lấy được vị trí. Hãy cho phép trang truy cập vị trí.'),
  { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  if (b.dataset.cat) state.cat = b.dataset.cat;
  else if (b.dataset.act === 'open') state.openNow = !state.openNow;
  else if (b.dataset.act === 'top') state.topRated = !state.topRated;
  else if (b.dataset.act === 'near') {
    if (state.near) state.near = false; else if (state.me) state.near = true; else return locate();
  }
  render();
});
$('#hero-sub').addEventListener('click', e => { if (e.target.closest('#open-link')) { state.openNow = !state.openNow; render(); } });

let qTimer;
$('#q').addEventListener('input', e => {
  $('#search-box').classList.toggle('has-text', !!e.target.value);
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { state.q = e.target.value; render(); }, 120);
});
$('#q-clear').addEventListener('click', e => {
  e.preventDefault(); $('#q').value = ''; state.q = '';
  $('#search-box').classList.remove('has-text'); render();
});
$('#reset').addEventListener('click', () => {
  Object.assign(state, { cat: 'all', openNow: false, topRated: false, q: '' });
  $('#q').value = ''; $('#search-box').classList.remove('has-text'); render();
});

document.addEventListener('click', e => {
  const nav = e.target.closest('.nav');
  if (nav) {
    e.stopPropagation();
    const shots = nav.parentElement.querySelector('.shots');
    shots.scrollBy({ left: shots.clientWidth * +nav.dataset.nav, behavior: 'smooth' });
    return;
  }
  if (e.target.closest('[data-close]')) return closeSheet();
  const g = e.target.closest('[data-grab]'); if (g) return grabGo(g.dataset.grab);
  const card = e.target.closest('.card'); if (card) return openSheet(card.dataset.id);
  if (e.target.closest('#peek')) {
    if (e.target.closest('.x')) return selectPlace(null);
    return openSheet(state.selected);
  }
}, true);
document.addEventListener('scroll', e => {
  const s = e.target;
  if (!(s instanceof Element) || !s.classList.contains('shots')) return;
  const i = Math.round(s.scrollLeft / s.clientWidth);
  s.parentElement.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', i === j));
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && e.target.classList?.contains('card')) openSheet(e.target.dataset.id);
});
$('#grid').addEventListener('mouseover', e => {
  const c = e.target.closest('.card');
  if (c && map && isDesktop()) highlightPins([c.dataset.id, state.selected].filter(Boolean));
});
$('#scrim').addEventListener('click', () => closeSheet());
window.addEventListener('popstate', () => closeSheet(true));
$('#view-toggle').addEventListener('click', () => setView(document.body.classList.contains('view-map') ? 'list' : 'map'));

new ResizeObserver(() => document.documentElement.style.setProperty('--bar-h', $('#toolbar').offsetHeight + 'px')).observe($('#toolbar'));
window.addEventListener('scroll', () => $('#toolbar').classList.toggle('stuck', window.scrollY > 10 && $('#toolbar').getBoundingClientRect().top <= 0), { passive: true });
matchMedia('(min-width: 960px)').addEventListener('change', ev => { if (ev.matches) { ensureMap(); render(); requestAnimationFrame(() => map?.invalidateSize()); } });
setInterval(render, 60000);

/* ================= Load ================= */
(async function load() {
  try {
    const res = await fetch('places.json?' + Date.now());
    const data = await res.json();
    state.places = (Array.isArray(data) ? data : (data.places || [])).map(p => ({
      ...p, _cats: catsOf(p),
      _search: norm([p.name, p.cuisine, p.address, p.note, ...(p.tags || [])].join(' ')),
    }));
  } catch {
    $('#hero-sub').textContent = 'Không tải được danh sách quán. Tải lại trang để thử lần nữa.';
    return;
  }
  setView('list');
  if (isDesktop()) ensureMap();
  render();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h && state.places.some(p => p.id === h)) { history.replaceState(null, '', location.pathname); openSheet(h); }
})();
</script>
</body>
</html>
